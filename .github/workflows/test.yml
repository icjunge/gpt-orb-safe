name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Check Windows setup script without installing
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\Install-Tools.cmd --check
      - name: Verify Windows installer build
        if: runner.os == 'Windows'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify release ZIPs with Windows default encoding
        if: runner.os == 'Windows'
        run: python scripts/package_windows.py --source-only --extension-zip --output dist
        env:
          PYTHONUTF8: '0'
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: 'error::EncodingWarning'
      - name: Keep the tested Windows installer for manual review
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-review-build
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/GPT-Orb-Setup-*-x64.exe
            dist/GPT-Orb-*-Source.zip
